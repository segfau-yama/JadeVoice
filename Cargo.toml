[package]
name = "JadeVoice"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "voice",
] }
poise = "0.6.1"
dotenv = "0.15.0"
songbird = { version = "0.6.1", features = ["builtin-queue"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm", "wav"] }
voicevox_api = { path="voicevox_api" }
dashmap = "6.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
